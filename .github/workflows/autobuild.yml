name: autobuild

on:
  push:
  release:
    types: published

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 
      uses: actions/setup-go@v5.3.0

    - name: Check out code
      uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0

    - name: Shorten SHA
      uses: benjlevesque/short-sha@v3.0

    - name: Setup current date time
      run: echo "DATETIME=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

    - name: Setup package name
      if: github.ref_type != 'tag'
      run: echo "PACKAGE=notesite_${{ env.DATETIME }}_${{ env.SHA }}" >> $GITHUB_ENV

    - name: Setup package name
      if: github.ref_type == 'tag'
      run: echo "PACKAGE=notesite_${{ github.ref_name }}_${{ env.SHA }}" >> $GITHUB_ENV

    - name: Build
      run: |
        VERSION=$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short HEAD 2>/dev/null || echo dev)
        CGO_ENABLED=0 go build -v -o notesite -ldflags "-X github.com/Streamlet/notesite/global.Version=$VERSION" .

    - name: Make package
      run: |
        tar -zcvf ${{ env.PACKAGE }}.tar.gz notesite
        echo ${{ env.PACKAGE }}.tar.gz > last_build

    - name: Upload Release on push tag
      if: github.ref_type == 'tag'
      uses: JasonEtco/upload-to-release@master
      with:
        args: ${{ env.PACKAGE }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to oss
      uses: tvrcgo/oss-action@v1.0.0
      with:
        key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
        key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        endpoint: ${{ vars.OSS_END_POINT }}
        bucket: ${{ vars.OSS_BUCKET }}
        assets: |
          ${{ env.PACKAGE }}.tar.gz:${{ vars.OSS_RELEASE_DIR }}/${{ env.PACKAGE }}.tar.gz
          last_build:${{ vars.OSS_RELEASE_DIR }}/last_build
